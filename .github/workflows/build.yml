# Personal fork CI: build Taiga with MSVC and run the QtTest suite.
# Third-party actions are pinned to full commit SHAs (tag noted alongside).
name: build

on:
  push:
    branches: [sg/main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Configure
        run: cmake --preset msvc-x64 -DTAIGA_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset msvc-x64-release

      - name: Test
        run: ctest --test-dir build/msvc-x64 -C RelWithDebInfo --output-on-failure
